<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Manager - Shell Platform</title>
  <script src="http://localhost:8887/shell-client.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap");
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "IBM Plex Sans", var(--shell-font-family, sans-serif);
      background: linear-gradient(160deg, #f3f7fb 0%, #eaf2f8 60%, #f6fafc 100%);
      color: #0f172a; padding: 20px; line-height: 1.5; min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { color: #0f3a5f; font-size: 1.8rem; margin-bottom: 4px; }
    .subtitle { color: #44617b; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #d6e5f2; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }
    .card h2 { font-size: 16px; margin-bottom: 14px; color: #173f63; }
    .user-table { width: 100%; border-collapse: collapse; }
    .user-table th, .user-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5edf6; }
    .user-table th { background: #f0f6fc; font-weight: 600; font-size: 12px; color: #46637f; text-transform: uppercase; letter-spacing: 0.05em; }
    .user-table tr:hover { background: #f9fcff; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-right: 4px; }
    .role-admin { background: #fef3c7; color: #92400e; }
    .role-user { background: #dbeafe; color: #1e40af; }
    .role-viewer { background: #f3f4f6; color: #4b5563; }
    .role-developer { background: #dcfce7; color: #166534; }
    .perm-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-family: "IBM Plex Mono", monospace; background: #f3f4f6; color: #374151; margin-right: 2px; }
    .btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #c5d8eb; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: #1f2937; }
    .btn:hover { background: #f3f4f6; }
    .btn-primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .btn-primary:hover { background: #1e40af; }
    .btn-danger { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .btn-danger:hover { background: #fecaca; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; border-radius: 14px; padding: 24px; max-width: 560px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 18px; margin-bottom: 16px; color: #1f2937; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 4px; text-transform: uppercase; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,0.1); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .hidden { display: none; }
    .empty { text-align: center; padding: 40px; color: #6b7280; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 16px; }
    .stat { flex: 1; text-align: center; padding: 12px; background: #f0f6fc; border-radius: 10px; }
    .stat-value { font-size: 24px; font-weight: 700; color: #134a72; }
    .stat-label { font-size: 11px; color: #6b7280; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="container">
    <h1>User & Role Manager</h1>
    <p class="subtitle">Manage users, roles, and permissions across the platform.</p>

    <div class="stats-row" id="stats-row">
      <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Users</div></div>
      <div class="stat"><div class="stat-value" id="stat-admins">0</div><div class="stat-label">Admins</div></div>
      <div class="stat"><div class="stat-value" id="stat-active">0</div><div class="stat-label">Active Roles</div></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="margin:0">Users</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Add User</button>
      </div>
      <table class="user-table">
        <thead>
          <tr><th>User</th><th>Roles</th><th>Permissions</th><th>Actions</th></tr>
        </thead>
        <tbody id="user-table-body"></tbody>
      </table>
      <div id="empty-state" class="empty hidden">No users found.</div>
    </div>
  </div>

  <div id="user-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title">Add User</h3>
      <input type="hidden" id="edit-user-id" />
      <div class="form-group">
        <label for="edit-user-name">Full Name</label>
        <input type="text" id="edit-user-name" required />
      </div>
      <div class="form-group">
        <label for="edit-user-email">Email</label>
        <input type="email" id="edit-user-email" required />
      </div>
      <div class="form-group">
        <label for="edit-user-role">Role</label>
        <select id="edit-user-role">
          <option value="admin">Admin</option>
          <option value="user">Standard User</option>
          <option value="viewer">Viewer</option>
          <option value="developer">Developer</option>
        </select>
      </div>
      <div class="form-group">
        <label for="edit-user-permissions">Additional Permissions (comma-separated)</label>
        <input type="text" id="edit-user-permissions" placeholder="app:read, documents:write" />
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Save</button>
      </div>
    </div>
  </div>

  <script src="./user-manager.js"></script>
</body>
</html>
