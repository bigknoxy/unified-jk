<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Manager - Shell Platform</title>
  <script src="http://localhost:8887/shell-client.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap");
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "IBM Plex Sans", var(--shell-font-family, sans-serif);
      background: linear-gradient(160deg, #f3f7fb 0%, #eaf2f8 60%, #f6fafc 100%);
      color: #0f172a; padding: 20px; line-height: 1.5; min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { color: #0f3a5f; font-size: 1.8rem; margin-bottom: 4px; }
    .subtitle { color: #44617b; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #d6e5f2; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }
    .card h2 { font-size: 16px; margin-bottom: 14px; color: #173f63; }
    .app-grid { display: grid; gap: 12px; }
    .app-card { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid #e2ecf5; border-radius: 10px; background: #fafcfe; transition: box-shadow 0.15s; }
    .app-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .app-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .app-info { flex: 1; min-width: 0; }
    .app-name { font-weight: 600; font-size: 15px; color: #1f2937; }
    .app-meta { font-size: 12px; color: #6b7280; }
    .app-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .toggle { padding: 6px 14px; border-radius: 999px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; }
    .toggle.enabled { background: #dcfce7; color: #166534; }
    .toggle.disabled { background: #fee2e2; color: #991b1b; }
    .btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #c5d8eb; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: #1f2937; }
    .btn:hover { background: #f3f4f6; }
    .btn-primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .btn-primary:hover { background: #1e40af; }
    .status-badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .status-enabled { background: #dcfce7; color: #166534; }
    .status-disabled { background: #fee2e2; color: #991b1b; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; border-radius: 14px; padding: 24px; max-width: 560px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 18px; margin-bottom: 16px; color: #1f2937; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 4px; text-transform: uppercase; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,0.1); }
    .icon-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .icon-option { width: 100%; aspect-ratio: 1; border: 2px solid #e5e7eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: all 0.15s; background: #fff; }
    .icon-option:hover { border-color: #93c5fd; background: #eff6ff; }
    .icon-option.selected { border-color: #1d4ed8; background: #dbeafe; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .empty { text-align: center; padding: 40px; color: #6b7280; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>App Manager</h1>
    <p class="subtitle">Manage registered applications, configure metadata, and control availability.</p>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="margin:0">Registered Apps</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Add App</button>
      </div>
      <div id="app-list" class="app-grid"></div>
      <div id="empty-state" class="empty hidden">No apps registered yet.</div>
    </div>
  </div>

  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modal-title">Edit App</h3>
      <input type="hidden" id="edit-app-id" />
      <div class="form-group">
        <label for="edit-name">App Name</label>
        <input type="text" id="edit-name" required />
      </div>
      <div class="form-group">
        <label for="edit-url">App URL</label>
        <input type="url" id="edit-url" required />
      </div>
      <div class="form-group">
        <label for="edit-description">Description</label>
        <textarea id="edit-description" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label for="edit-category">Category</label>
        <input type="text" id="edit-category" />
      </div>
      <div class="form-group">
        <label for="edit-version">Version</label>
        <input type="text" id="edit-version" placeholder="1.0.0" />
      </div>
      <div class="form-group">
        <label>Icon</label>
        <div class="icon-picker" id="icon-picker"></div>
      </div>
      <div class="form-group">
        <label for="edit-permissions">Permissions (comma-separated)</label>
        <input type="text" id="edit-permissions" placeholder="app:read, app:write" />
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveApp()">Save</button>
      </div>
    </div>
  </div>

  <script src="./admin-manager.js"></script>
</body>
</html>
